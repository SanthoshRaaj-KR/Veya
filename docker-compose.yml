# Local infrastructure for Veya.
#
#   postgres  — the authoritative store: runs, events, tasks, effects, leases.
#   nats      — task delivery only. Nothing durable lives here: if the whole
#               stream vanished, every task would still be PENDING in Postgres
#               and the recovery scan would republish it.
#
# Usage: `make up` / `make down`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: veya-postgres
    environment:
      POSTGRES_USER: veya
      POSTGRES_PASSWORD: veya
      POSTGRES_DB: veya
    ports:
      # 5433 on the host, not 5432: a developer machine very often already has
      # PostgreSQL listening on the default port, and the failure mode when it
      # does is silent — you connect to the wrong database and get a confusing
      # error about a missing role rather than a refused connection.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veya -d veya"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2-alpine
    container_name: veya-nats
    # -m 8222 is what makes the monitoring endpoint exist. Publishing the port
    # without it leaves the healthcheck below permanently failing against a
    # socket nothing is listening on, which reads as "NATS is broken" when the
    # server is in fact fine.
    command: ["--jetstream", "--store_dir=/data", "-m", "8222"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  natsdata:
