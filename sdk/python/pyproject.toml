[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veya"
version = "0.4.0"
description = "Write durable agents in Python; the Veya runtime makes their effects happen exactly once."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "../../LICENSE" }
authors = [{ name = "Santhosh Raaj K R" }]
keywords = ["agents", "durable-execution", "workflow", "idempotency", "veya"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

# grpcio and protobuf, and nothing else. The SDK's whole job is to speak one
# protocol and replay one function; a dependency beyond the two that make the
# protocol work would be a dependency the runtime's correctness could come to
# rest on without anyone deciding that it should.
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
    "grpcio-tools>=1.60",
    "types-protobuf",
]

[project.urls]
Homepage = "https://github.com/SanthoshRaaj-KR/Veya"
Source = "https://github.com/SanthoshRaaj-KR/Veya"

[tool.hatch.build.targets.wheel]
packages = ["veya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"

# The generated protocol stubs are not ours to lint. They are regenerated by
# `make proto` and any complaint about them is a complaint about protoc.
extend-exclude = ["veya/worker"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["veya", "tests"]

# The generated stubs are typed loosely and are not worth fighting; protoc
# owns them.
[[tool.mypy.overrides]]
module = ["veya.worker.*"]
ignore_errors = true
follow_imports = "skip"

# veya.session is the one module that calls into the generated stubs, so it is
# the one module that has to tolerate their typing. Everything else in the
# package stays strict.
[[tool.mypy.overrides]]
module = ["veya.session"]
disallow_untyped_calls = false

# Tests are strict about behaviour, not about annotations. Requiring a return
# type on every test function buys nothing and makes each test longer than the
# thing it checks.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
disallow_any_generics = false
# ctx.call returns Any by nature — a tool's result is opaque JSON — so a test
# body that returns it directly is not hiding anything.
warn_return_any = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true
