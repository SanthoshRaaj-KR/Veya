# Continuous integration for Veya.
#
# This file exists mainly for one job: `race`. The race detector needs a C
# toolchain, the machine this project is developed on does not have one, and
# Layer 3 added real concurrency — heartbeat goroutines, the outbox relay, the
# lease reaper, workers in separate processes. An unrun race detector over that
# is the highest-value check the project was missing, and "run it on a machine
# that has gcc" is a thing CI is for.
#
# Carried from docs/status.md §3, item 1.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GOFLAGS: -mod=mod

jobs:
  # Formatting and vet run first and alone: they are seconds long, and there is
  # no sense spinning up PostgreSQL and NATS to discover a missing gofmt.
  static:
    name: vet and gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        # The repo stores LF. On the development machine core.autocrlf=true
        # gives the worktree CRLF and gofmt occasionally objects for that
        # reason alone; on Linux there is no such excuse, so this is strict.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: generated protocol code is current
        # The stubs are committed so that a Go-only machine needs no protoc.
        # The risk that buys is a .proto edited without regenerating, which
        # would leave the wire contract and the code that implements it
        # disagreeing. Regenerating here and diffing is what closes it.
        run: |
          python -m pip install --quiet grpcio-tools
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          PATH="$(go env GOPATH)/bin:$PATH" python -m grpc_tools.protoc -Iproto             --go_out=. --go_opt=module=github.com/SanthoshRaaj-KR/Veya             --go-grpc_out=. --go-grpc_opt=module=github.com/SanthoshRaaj-KR/Veya             --python_out=sdk/python --pyi_out=sdk/python --grpc_python_out=sdk/python             proto/veya/worker/v1/worker.proto
          if ! git diff --quiet -- internal/sdk/workerpb sdk/python/veya/worker; then
            echo "generated protocol code is out of date; run 'make proto' and commit"
            git --no-pager diff --stat -- internal/sdk/workerpb sdk/python/veya/worker
            exit 1
          fi

      - name: go vet (integration build tag)
        # Integration tests are build-tagged, so the default vet never compiles
        # them. A test that does not build is a test that silently stops
        # running.
        run: go vet -tags=integration ./...

  # The Python SDK, on its own. It needs no PostgreSQL, no NATS and no Go
  # runtime: the suite runs the agent body and the replay driver against a fake
  # gateway, which is the point of having drawn the boundary where it is.
  sdk:
    name: python sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install
        run: python -m pip install --quiet -e ".[dev]"

      - name: ruff
        run: python -m ruff check . && python -m ruff format --check .

      - name: mypy
        run: python -m mypy

      - name: pytest
        run: python -m pytest -q

  # The unit suite, with no Docker, under the race detector. -count=2 runs
  # every test twice: a data race that needs two goroutines to interleave does
  # not always show up on the first pass.
  race:
    name: unit tests (race detector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=2 ./...

  # The worked example, actually run. This is Phase 6's headline exit
  # criterion — "examples/refund_agent.py runs end to end" — and the only
  # check that exercises the Go runtime and the Python SDK in one process
  # tree, over a real socket, against the real engine and the real ledger.
  #
  # No Docker: the example uses the memory store, because what is under test
  # is the protocol.
  example:
    name: the refund agent, end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install the SDK
        run: python -m pip install --quiet -e sdk/python

      - name: make demo-python
        # The script exits with the run's status, so a run that finished
        # anything other than COMPLETED fails the job.
        run: bash scripts/demo-python.sh

  # The same suite plus everything build-tagged `integration`, against real
  # PostgreSQL and real NATS. Service containers rather than docker compose:
  # the compose file maps PostgreSQL to 5433 to avoid a developer's host
  # install, and a CI runner has no host install to avoid.
  integration:
    name: integration tests (postgres + nats)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veya
          POSTGRES_PASSWORD: veya
          POSTGRES_DB: veya
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U veya -d veya"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      VEYA_TEST_DSN: postgres://veya:veya@localhost:5433/veya?sslmode=disable
      VEYA_TEST_NATS_URL: nats://127.0.0.1:4222

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: start nats (jetstream)
        run: |
          docker run -d --name veya-nats \
            -p 4222:4222 -p 8222:8222 \
            nats:2-alpine -js -m 8222
          for _ in $(seq 1 30); do
            if wget -q -O- http://127.0.0.1:8222/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "nats did not become healthy"
          docker logs veya-nats
          exit 1

      - name: apply migrations
        run: go run ./cmd/veya migrate --dsn "$VEYA_TEST_DSN"

      - name: go test -tags=integration
        # -count=1 defeats the test cache: a suite whose result depends on
        # external state must not be answered from a previous run's cache.
        run: go test -tags=integration -count=1 ./...

      - name: the demo, end to end
        run: go run ./cmd/veya-runtime --dsn "$VEYA_TEST_DSN" --demo

      - name: the demo, over JetStream
        run: go run ./cmd/veya-runtime --dsn "$VEYA_TEST_DSN" --dispatch jetstream --nats "$VEYA_TEST_NATS_URL" --demo

      - name: stop nats
        if: always()
        run: docker rm -f veya-nats
